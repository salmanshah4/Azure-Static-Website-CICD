name: Deploy static site to Azure

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload site to $web
        run: |
          az storage blob upload-batch \
            --account-name ${{ vars.STORAGE_ACCOUNT }} \
            --auth-mode login \
            --destination '$web' \
            --source site \
            --overwrite
